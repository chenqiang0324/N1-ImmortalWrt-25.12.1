name: Build N1 ImmortalWrt 25.12.1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_VERSION: "v25.12.1"

  # N1 = Amlogic S905D
  N1_BOARD: "s905d"

  # ImmortalWrt 25.12.1 currently uses Linux 6.12.x.
  # Let the source tree select the exact 6.12.x revision.
  KERNEL_SERIES: "6.12.y"

  LAN_IP: "10.0.0.254"
  LAN_NETMASK: "255.255.255.0"

  # N1 eMMC image size
  OPENWRT_SIZE: "256/2048"

jobs:

  build:

    name: Build ImmortalWrt 25.12.1 for Phicomm N1

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. Checkout workflow repository
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Free disk space
      # ==========================================================

      - name: Free disk space
        run: |

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          df -h


      # ==========================================================
      # 3. Install dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xz-utils \
            zstd \
            ccache \
            swig \
            time \
            patch \
            diffutils \
            tar \
            gzip \
            bc \
            perl \
            libelf-dev \
            device-tree-compiler

          echo
          echo "Python:"
          python3 --version

          echo
          echo "GCC:"
          gcc --version | head -1


      # ==========================================================
      # 4. Clone ImmortalWrt 25.12.1
      # ==========================================================

      - name: Clone ImmortalWrt
        run: |

          git clone \
            --depth=1 \
            --branch="${IMMORTALWRT_VERSION}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo
          echo "=========================================="
          echo "ImmortalWrt version"
          echo "=========================================="

          git describe --tags --always
          git rev-parse HEAD


      # ==========================================================
      # 5. Add third-party feeds
      # ==========================================================

      - name: Add third party feeds
        run: |

          cd immortalwrt

          mkdir -p package/third-party


          # ------------------------------------------------------
          # DAED / PassWall2 / related packages
          # ------------------------------------------------------

          echo
          echo "Adding sbwml/openwrt_helloworld"

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/third-party/helloworld


          # ------------------------------------------------------
          # Lucky
          # ------------------------------------------------------

          echo
          echo "Adding Lucky"

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/third-party/lucky


          # ------------------------------------------------------
          # Amlogic Treasure Box
          # ------------------------------------------------------

          echo
          echo "Adding Amlogic"

          git clone \
            --depth=1 \
            https://github.com/ophub/luci-app-amlogic.git \
            package/third-party/luci-app-amlogic


          # ------------------------------------------------------
          # iStore
          # ------------------------------------------------------

          echo
          echo "Adding iStore"

          git clone \
            --depth=1 \
            https://github.com/linkease/istore.git \
            package/third-party/istore


          # ------------------------------------------------------
          # QuickFile
          #
          # Use sbwml package collection.
          # Do not use the old/non-existing repository path.
          # ------------------------------------------------------

          echo
          echo "Adding sbwml packages"

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_pkgs.git \
            package/third-party/sbwml


      # ==========================================================
      # 6. Update feeds
      # ==========================================================

      - name: Update feeds
        run: |

          cd immortalwrt

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ==========================================================
      # 7. Check package availability
      # ==========================================================

      - name: Check required packages
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Checking required packages"
          echo "=========================================="


          PACKAGES="
          luci-app-daed
          luci-app-passwall2
          lucky
          luci-app-lucky
          luci-app-store
          luci-app-amlogic
          tailscale
          luci-app-tailscale-community
          minidlna
          luci-app-minidlna
          ttyd
          luci-app-ttyd
          vlmcsd
          luci-app-vlmcsd
          luci-app-quickfile
          luci-app-upnp
          kmod-usb-storage
          kmod-fs-ext4
          kmod-fs-vfat
          kmod-fs-exfat
          block-mount
          usbutils
          curl
          wget-ssl
          htop
          "


          FAILED=0


          for p in ${PACKAGES}; do

            echo
            echo "Checking: ${p}"

            FOUND=$(find package feeds -type f -name Makefile \
              -exec grep -l \
              -E "^Package/${p}([[:space:]]|$)|^PKG_NAME[[:space:]]*:?=[[:space:]]*${p}([[:space:]]|$)" \
              {} + 2>/dev/null \
              | head -1 || true)

            if [ -n "${FOUND}" ]; then

              echo "[ OK ] ${p}"
              echo "       ${FOUND}"

            else

              echo "[WARN] ${p} was not found"

            fi

          done


          echo
          echo "Package check completed."

          # Do not fail here for optional third-party package names.
          # make defconfig below is the final authority.


      # ==========================================================
      # 8. Create base configuration
      # ==========================================================

      - name: Create base configuration
        run: |

          cd immortalwrt

          cat > .config <<'EOF'

          #
          # ======================================================
          # Target
          # ======================================================
          #

          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y


          #
          # ======================================================
          # Root filesystem
          # ======================================================
          #

          CONFIG_TARGET_ROOTFS_TARGZ=y


          #
          # ======================================================
          # LuCI / Chinese
          # ======================================================
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          #
          # ======================================================
          # Firewall
          # ======================================================
          #

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y


          #
          # ======================================================
          # DAED
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-daed=y


          #
          # ======================================================
          # PassWall2
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-passwall2=y


          #
          # ======================================================
          # Lucky
          # ======================================================
          #

          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y


          #
          # ======================================================
          # iStore
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-store=y


          #
          # ======================================================
          # Amlogic Treasure Box
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-amlogic=y


          #
          # ======================================================
          # Tailscale
          # ======================================================
          #

          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y


          #
          # ======================================================
          # MiniDLNA
          # ======================================================
          #

          CONFIG_PACKAGE_minidlna=y
          CONFIG_PACKAGE_luci-app-minidlna=y


          #
          # ======================================================
          # TTYD
          # ======================================================
          #

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y


          #
          # ======================================================
          # VLMCSD
          # ======================================================
          #

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          #
          # ======================================================
          # QuickFile
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-quickfile=y


          #
          # ======================================================
          # UPnP
          # ======================================================
          #

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y


          #
          # ======================================================
          # USB
          # ======================================================
          #

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_usbutils=y


          #
          # ======================================================
          # Filesystems
          # ======================================================
          #

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_block-mount=y


          #
          # ======================================================
          # Utilities
          # ======================================================
          #

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y

          EOF


      # ==========================================================
      # 9. Resolve dependencies
      # ==========================================================

      - name: Resolve package dependencies
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Running make defconfig"
          echo "=========================================="

          make defconfig V=s


      # ==========================================================
      # 10. Show final selected packages
      # ==========================================================

      - name: Show final configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Final selected packages"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_' .config \
            | grep -E \
            'daed|passwall|lucky|quickfile|store|amlogic|tailscale|minidlna|ttyd|vlmcsd|upnp|usb-storage|fs-ext4|fs-vfat|fs-exfat|block-mount|usbutils|curl|wget-ssl|htop' \
            | sort \
            || true


      # ==========================================================
      # 11. Configure LAN IP
      # ==========================================================

      - name: Configure LAN
        run: |

          cd immortalwrt

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-n1-network <<'EOF'
          #!/bin/sh

          uci set network.lan.ipaddr='10.0.0.254'
          uci set network.lan.netmask='255.255.255.0'

          uci commit network

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-n1-network


      # ==========================================================
      # 12. DAED / eBPF kernel configuration
      #
      # IMPORTANT:
      #
      # We modify the kernel configuration fragment BEFORE
      # building the kernel.
      #
      # We do NOT use:
      #
      # target/linux/config
      # target/linux/oldconfig
      # target/linux/refresh
      #
      # Those caused the previous failures.
      # ==========================================================

      - name: Configure DAED kernel support
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Locating Linux 6.12 configuration"
          echo "=========================================="


          CONFIG_FILE=$(find target/linux \
            -type f \
            \( \
              -name 'config-6.12' \
              -o -name 'config-6.12.*' \
            \) \
            | head -1)


          if [ -z "${CONFIG_FILE}" ]; then

            echo "ERROR: Linux 6.12 kernel config fragment was not found."

            echo
            echo "Available kernel config files:"

            find target/linux \
              -type f \
              -name 'config-*' \
              -print \
              | sort

            exit 1

          fi


          echo "Using kernel config:"
          echo "${CONFIG_FILE}"


          cat >> "${CONFIG_FILE}" <<'EOF'

          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_STREAM_PARSER=y

          CONFIG_CGROUPS=y

          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y

          CONFIG_NET_INGRESS=y
          CONFIG_NET_EGRESS=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_CLS_BPF=m
          CONFIG_NET_SCH_INGRESS=m

          CONFIG_DEBUG_INFO=y
          # CONFIG_DEBUG_INFO_REDUCED is not set
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_BTF_MODULES=y

          EOF


          echo
          echo "DAED kernel options added."


      # ==========================================================
      # 13. Resolve kernel configuration
      # ==========================================================

      - name: Resolve kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Resolving final kernel configuration"
          echo "=========================================="


          make defconfig V=s


      # ==========================================================
      # 14. Verify kernel configuration fragment
      # ==========================================================

      - name: Verify DAED kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Checking DAED kernel requirements"
          echo "=========================================="


          CONFIG_FILE=$(find target/linux \
            -type f \
            \( \
              -name 'config-6.12' \
              -o -name 'config-6.12.*' \
            \) \
            | head -1)


          if [ -z "${CONFIG_FILE}" ]; then
            echo "ERROR: kernel config not found"
            exit 1
          fi


          FAILED=0


          check()
          {
            ITEM="$1"

            if grep -q "^${ITEM}$" "${CONFIG_FILE}"; then

              echo "[ OK ] ${ITEM}"

            else

              echo "[WARN] ${ITEM}"

            fi
          }


          check "CONFIG_BPF=y"
          check "CONFIG_BPF_SYSCALL=y"
          check "CONFIG_BPF_JIT=y"
          check "CONFIG_BPF_EVENTS=y"
          check "CONFIG_BPF_STREAM_PARSER=y"
          check "CONFIG_CGROUPS=y"
          check "CONFIG_KPROBES=y"
          check "CONFIG_KPROBE_EVENTS=y"
          check "CONFIG_NET_INGRESS=y"
          check "CONFIG_NET_EGRESS=y"
          check "CONFIG_NET_CLS_ACT=y"
          check "CONFIG_DEBUG_INFO=y"
          check "CONFIG_DEBUG_INFO_BTF=y"
          check "CONFIG_DEBUG_INFO_BTF_MODULES=y"


          echo
          echo "Kernel configuration check finished."


      # ==========================================================
      # 15. Build ImmortalWrt
      # ==========================================================

      - name: Build ImmortalWrt
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Building ImmortalWrt"
          echo "=========================================="

          make -j2 V=s


      # ==========================================================
      # 16. Locate rootfs tarball
      # ==========================================================

      - name: Locate rootfs
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Locating generic ARM64 rootfs"
          echo "=========================================="

          find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            -print \
            | sort


          ROOTFS=$(find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -1)


          if [ -z "${ROOTFS}" ]; then

            echo
            echo "ERROR: rootfs.tar.gz not found."

            find bin/targets \
              -type f \
              -print \
              | sort

            exit 1

          fi


          echo "ROOTFS=${ROOTFS}" >> "${GITHUB_ENV}"


      # ==========================================================
      # 17. Upload generic ImmortalWrt build
      # ==========================================================

      - name: Upload generic ARM64 rootfs
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.1-N1-generic-rootfs

          path: |

            immortalwrt/bin/targets/**/**/*rootfs.tar.gz

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 18. Clone ophub Amlogic packaging system
      # ==========================================================

      - name: Prepare Amlogic packaging
        run: |

          echo
          echo "=========================================="
          echo "Preparing ophub Amlogic packaging"
          echo "=========================================="


          git clone \
            --depth=1 \
            https://github.com/ophub/amlogic-s9xxx-openwrt.git \
            amlogic-s9xxx-openwrt


      # ==========================================================
      # 19. Package N1 / S905D eMMC image
      #
      # This converts the generic armsr/armv8 rootfs into
      # an Amlogic S905D image.
      # ==========================================================

      - name: Package N1 S905D image
        run: |

          echo
          echo "=========================================="
          echo "Packaging Phicomm N1 / S905D"
          echo "=========================================="


          cd amlogic-s9xxx-openwrt


          ROOTFS="../${ROOTFS}"


          echo
          echo "Rootfs:"
          echo "${ROOTFS}"


          if [ ! -f "${ROOTFS}" ]; then

            echo
            echo "ERROR: rootfs file does not exist."

            exit 1

          fi


          echo
          echo "Running ophub packaging."


          sudo ./remake \
            -b s905d \
            -k 6.12.y \
            -u stable \
            -a true \
            -p "${LAN_IP}" \
            -s "${OPENWRT_SIZE}" \
            -n "N1-ImmortalWrt-25.12.1"


      # ==========================================================
      # 20. Show N1 firmware
      # ==========================================================

      - name: Show N1 firmware
        run: |

          echo
          echo "=========================================="
          echo "N1 firmware output"
          echo "=========================================="


          find amlogic-s9xxx-openwrt/out \
            -type f \
            -print \
            2>/dev/null \
            | sort


      # ==========================================================
      # 21. Upload N1 eMMC firmware
      # ==========================================================

      - name: Upload N1 firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.1-N1-S905D-eMMC

          path: |

            amlogic-s9xxx-openwrt/out/**

          if-no-files-found: error

          retention-days: 30
