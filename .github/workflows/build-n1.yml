name: Build N1 ImmortalWrt 25.12.1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_VERSION: "v25.12.1"

  # ==========================================================
  # Phicomm N1
  # Amlogic S905D
  # ==========================================================
  N1_BOARD: "s905d"

  # ==========================================================
  # Network
  # ==========================================================
  LAN_IP: "10.0.0.254"
  LAN_NETMASK: "255.255.255.0"

  # ==========================================================
  # ophub kernel
  #
  # 6.12.y + stable + auto=true
  # means latest stable kernel in 6.12 series.
  # ==========================================================
  KERNEL_SERIES: "6.12.y"

  # ==========================================================
  # N1 eMMC image partitions
  #
  # BOOTFS / ROOTFS
  # ==========================================================
  IMAGE_SIZE: "256/2048"


jobs:

  build:

    name: N1 S905D ImmortalWrt 25.12.1

    runs-on: ubuntu-24.04


    steps:

      # ========================================================
      # 1. Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # 2. Free disk space
      # ========================================================

      - name: Free disk space
        run: |

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          df -h


      # ========================================================
      # 3. Install build dependencies
      # ========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xz-utils \
            zstd \
            ccache \
            swig \
            time \
            patch \
            diffutils \
            tar \
            gzip \
            bc \
            perl \
            libelf-dev \
            device-tree-compiler

          echo
          echo "=========================================="
          echo "Build environment"
          echo "=========================================="

          python3 --version
          gcc --version | head -1
          clang --version | head -1


      # ========================================================
      # 4. Clone ImmortalWrt 25.12.1
      # ========================================================

      - name: Clone ImmortalWrt
        run: |

          echo
          echo "=========================================="
          echo "Clone ImmortalWrt"
          echo "=========================================="

          git clone \
            --depth=1 \
            --branch="${IMMORTALWRT_VERSION}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo
          echo "ImmortalWrt:"
          git describe --tags --always

          echo
          echo "Commit:"
          git rev-parse HEAD


      # ========================================================
      # 5. Add third-party packages
      # ========================================================

      - name: Add third party packages
        run: |

          cd immortalwrt

          mkdir -p package/third-party


          # ----------------------------------------------------
          # DAED / PassWall2
          # ----------------------------------------------------

          echo
          echo "Adding sbwml/openwrt_helloworld"

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/third-party/helloworld


          # ----------------------------------------------------
          # Lucky
          # ----------------------------------------------------

          echo
          echo "Adding Lucky"

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/third-party/lucky


          # ----------------------------------------------------
          # Amlogic Treasure Box
          # ----------------------------------------------------

          echo
          echo "Adding Amlogic Treasure Box"

          git clone \
            --depth=1 \
            https://github.com/ophub/luci-app-amlogic.git \
            package/third-party/luci-app-amlogic


          
          # ----------------------------------------------------
          # sbwml extra packages
          #
          # Contains vlmcsd and other useful packages.
          # ----------------------------------------------------

          echo
          echo "Adding sbwml extra packages"

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_pkgs.git \
            package/third-party/sbwml


      # ========================================================
      # 6. Update feeds
      # ========================================================

      - name: Update feeds
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Updating feeds"
          echo "=========================================="

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ========================================================
      # 7. Check package source availability
      #
      # IMPORTANT:
      #
      # We do NOT fail here.
      #
      # make defconfig is the real dependency resolver.
      # ========================================================

      - name: Inspect requested packages
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Inspect requested packages"
          echo "=========================================="


          for p in \
            daed \
            luci-app-daed \
            luci-app-passwall2 \
            lucky \
            luci-app-lucky \
            luci-app-store \
            luci-app-amlogic \
            tailscale \
            luci-app-tailscale-community \
            minidlna \
            luci-app-minidlna \
            ttyd \
            luci-app-ttyd \
            vlmcsd \
            luci-app-vlmcsd \
            luci-app-quickfile \
            luci-app-upnp \
            kmod-usb-storage \
            kmod-fs-ext4 \
            kmod-fs-vfat \
            kmod-fs-exfat \
            block-mount \
            usbutils \
            curl \
            wget-ssl \
            htop
          do

            echo
            echo "------------------------------------------"
            echo "Package: ${p}"
            echo "------------------------------------------"

            find package feeds \
              -type f \
              -name Makefile \
              -exec grep -l \
              -E "^Package/${p}([[:space:]]|$)|^PKG_NAME[[:space:]]*:?=[[:space:]]*${p}([[:space:]]|$)" \
              {} + \
              2>/dev/null \
              | head -5 \
              || true

          done


      # ========================================================
      # 8. Create base .config
      # ========================================================

      - name: Create OpenWrt configuration
        run: |

          cd immortalwrt

          cat > .config <<'EOF'

          #
          # ======================================================
          # Target
          # ======================================================
          #

          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y


          #
          # ======================================================
          # Root filesystem
          # ======================================================
          #

          CONFIG_TARGET_ROOTFS_TARGZ=y


          #
          # ======================================================
          # LuCI
          # ======================================================
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          #
          # ======================================================
          # Firewall
          # ======================================================
          #

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y


          #
          # ======================================================
          # DAED
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-daed=y


          #
          # ======================================================
          # PassWall2
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-passwall2=y


          #
          # ======================================================
          # Lucky
          # ======================================================
          #

          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y




          #
          # ======================================================
          # Amlogic Treasure Box
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-amlogic=y


          #
          # ======================================================
          # Tailscale
          # ======================================================
          #

          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y


          #
          # ======================================================
          # MiniDLNA
          # ======================================================
          #

          CONFIG_PACKAGE_minidlna=y
          CONFIG_PACKAGE_luci-app-minidlna=y


          #
          # ======================================================
          # TTYD
          # ======================================================
          #

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y


          #
          # ======================================================
          # VLMCSD
          # ======================================================
          #

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          #
          # ======================================================
          # QuickFile
          # ======================================================
          #

          CONFIG_PACKAGE_luci-app-quickfile=y


          #
          # ======================================================
          # UPnP
          # ======================================================
          #

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y


          #
          # ======================================================
          # USB
          # ======================================================
          #

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_usbutils=y


          #
          # ======================================================
          # Filesystems
          # ======================================================
          #

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_block-mount=y


          #
          # ======================================================
          # Utilities
          # ======================================================
          #

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y

          EOF


      # ========================================================
      # 9. Resolve package dependencies
      # ========================================================

      - name: Resolve package dependencies
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Running make defconfig"
          echo "=========================================="

          make defconfig V=s


      # ========================================================
      # 10. Verify final package selection
      # ========================================================

      - name: Verify package selection
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Final package selection"
          echo "=========================================="


          grep '^CONFIG_PACKAGE_' .config \
            | grep -E \
            'daed|passwall|lucky|quickfile|store|amlogic|tailscale|minidlna|ttyd|vlmcsd|upnp|usb-storage|fs-ext4|fs-vfat|fs-exfat|block-mount|usbutils|curl|wget-ssl|htop' \
            | sort \
            || true


      # ========================================================
      # 11. Configure LAN
      # ========================================================

      - name: Configure LAN
        run: |

          cd immortalwrt

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-n1-network <<'EOF'
          #!/bin/sh

          uci set network.lan.ipaddr='10.0.0.254'
          uci set network.lan.netmask='255.255.255.0'

          uci commit network

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-n1-network


      # ========================================================
      # 12. Configure DAED kernel requirements
      #
      # We do NOT use:
      #
      # make target/linux/config
      # make target/linux/oldconfig
      # make target/linux/refresh
      #
      # These caused previous failures.
      #
      # Instead:
      #
      # modify the existing Linux 6.12 configuration fragment
      # then run normal make defconfig.
      # ========================================================

      - name: Configure DAED kernel support
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Locating Linux kernel configuration"
          echo "=========================================="


          CONFIG_FILE=$(find target/linux \
            -type f \
            \( \
              -name 'config-6.12' \
              -o -name 'config-6.12.*' \
            \) \
            | head -1)


          if [ -z "${CONFIG_FILE}" ]; then

            echo
            echo "ERROR: Linux 6.12 kernel configuration fragment not found."

            echo
            echo "Available kernel configuration fragments:"

            find target/linux \
              -type f \
              -name 'config-*' \
              -print \
              | sort

            exit 1

          fi


          echo
          echo "Using kernel config:"
          echo "${CONFIG_FILE}"


          # ------------------------------------------------------
          # Remove previous copies if this workflow is re-run
          # ------------------------------------------------------

          sed -i \
            -e '/^CONFIG_BPF=y$/d' \
            -e '/^CONFIG_BPF_SYSCALL=y$/d' \
            -e '/^CONFIG_BPF_JIT=y$/d' \
            -e '/^CONFIG_BPF_EVENTS=y$/d' \
            -e '/^CONFIG_BPF_STREAM_PARSER=y$/d' \
            -e '/^CONFIG_CGROUPS=y$/d' \
            -e '/^CONFIG_KPROBES=y$/d' \
            -e '/^CONFIG_KPROBE_EVENTS=y$/d' \
            -e '/^CONFIG_NET_INGRESS=y$/d' \
            -e '/^CONFIG_NET_EGRESS=y$/d' \
            -e '/^CONFIG_NET_CLS_ACT=y$/d' \
            -e '/^CONFIG_NET_CLS_BPF=m$/d' \
            -e '/^CONFIG_NET_SCH_INGRESS=m$/d' \
            -e '/^CONFIG_DEBUG_INFO=y$/d' \
            -e '/^CONFIG_DEBUG_INFO_BTF=y$/d' \
            -e '/^CONFIG_DEBUG_INFO_BTF_MODULES=y$/d' \
            -e '/^# CONFIG_DEBUG_INFO_REDUCED is not set$/d' \
            "${CONFIG_FILE}"


          cat >> "${CONFIG_FILE}" <<'EOF'

          #
          # DAED / eBPF support
          #

          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_STREAM_PARSER=y

          CONFIG_CGROUPS=y

          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y

          CONFIG_NET_INGRESS=y
          CONFIG_NET_EGRESS=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_CLS_BPF=m
          CONFIG_NET_SCH_INGRESS=m

          CONFIG_DEBUG_INFO=y
          # CONFIG_DEBUG_INFO_REDUCED is not set
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_BTF_MODULES=y

          EOF


          echo
          echo "DAED kernel configuration added."


      # ========================================================
      # 13. Resolve kernel configuration normally
      # ========================================================

      - name: Resolve kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Resolving kernel configuration"
          echo "=========================================="


          make defconfig V=s


      # ========================================================
      # 14. Verify DAED kernel configuration
      # ========================================================

      - name: Verify DAED kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Verifying DAED kernel support"
          echo "=========================================="


          CONFIG_FILE=$(find target/linux \
            -type f \
            \( \
              -name 'config-6.12' \
              -o -name 'config-6.12.*' \
            \) \
            | head -1)


          if [ -z "${CONFIG_FILE}" ]; then

            echo "ERROR: kernel config not found."

            exit 1

          fi


          echo
          echo "Kernel configuration:"
          echo "${CONFIG_FILE}"


          echo
          echo "Requested options:"


          grep -E \
            '^CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|BPF_STREAM_PARSER|CGROUPS|KPROBES|KPROBE_EVENTS|NET_INGRESS|NET_EGRESS|NET_CLS_ACT|NET_CLS_BPF|NET_SCH_INGRESS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES)=' \
            "${CONFIG_FILE}" \
            || true


          echo
          echo "Kernel series detected from source:"


          grep -R \
            'LINUX_VERSION' \
            target/linux \
            2>/dev/null \
            | head -20 \
            || true


      # ========================================================
      # 15. Build ImmortalWrt
      # ========================================================

      - name: Build ImmortalWrt
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Building ImmortalWrt 25.12.1"
          echo "=========================================="


          make -j1 V=s


      # ========================================================
      # 16. Verify build output
      # ========================================================

      - name: Verify build output
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Build output"
          echo "=========================================="


          find bin/targets \
            -type f \
            -print \
            | sort


          echo
          echo "=========================================="
          echo "Rootfs archives"
          echo "=========================================="


          find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            -print \
            | sort


      # ========================================================
      # 17. Upload generic ARM64 rootfs
      #
      # This is the input for ophub's packaging action.
      # ========================================================

      - name: Upload generic ARM64 rootfs
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.1-N1-generic-rootfs

          path: |

            immortalwrt/bin/targets/**/**/*rootfs.tar.gz

          if-no-files-found: error

          retention-days: 30


      # ========================================================
      # 18. Package N1 / S905D using ophub
      #
      # IMPORTANT:
      #
      # ophub officially supports:
      #
      # s905d = Phicomm N1
      #
      # openwrt_path:
      #   points directly to our generated rootfs.tar.gz
      #
      # openwrt_board:
      #   s905d
      #
      # openwrt_kernel:
      #   6.12.y
      #
      # auto_kernel:
      #   true
      #
      # openwrt_ip:
      #   10.0.0.254
      #
      # openwrt_size:
      #   256/2048
      # ========================================================

      - name: Package Phicomm N1 S905D eMMC firmware
        id: package_n1
        uses: ophub/amlogic-s9xxx-openwrt@main

        with:

          openwrt_path: "immortalwrt/bin/targets/**/**/*rootfs.tar.gz"

          openwrt_board: "s905d"

          kernel_repo: "ophub/kernel"

          kernel_usage: "stable"

          openwrt_kernel: "6.12.y"

          auto_kernel: "true"

          openwrt_ip: "10.0.0.254"

          openwrt_size: "256/2048"

          builder_name: "N1-ImmortalWrt-25.12.1"


      # ========================================================
      # 19. Show ophub output
      # ========================================================

      - name: Show N1 firmware
        run: |

          echo
          echo "=========================================="
          echo "ophub packaging output"
          echo "=========================================="


          if [ -d "out" ]; then

            find out \
              -type f \
              -print \
              | sort

          else

            echo "ERROR: ophub output directory not found."

            exit 1

          fi


      # ========================================================
      # 20. Upload N1 firmware
      # ========================================================

      - name: Upload N1 eMMC firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.1-N1-S905D-eMMC-10.0.0.254

          path: |

            out/**

          if-no-files-found: error

          retention-days: 30
