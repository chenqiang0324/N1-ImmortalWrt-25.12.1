name: Build N1 ImmortalWrt 25.12.1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_VERSION: "v25.12.1"
  LAN_IP: "10.0.0.254"
  LAN_NETMASK: "255.255.255.0"
  N1_BOARD: "s905d"
  KERNEL_BRANCH: "6.12.y"

jobs:

  build:

    name: N1 S905D ImmortalWrt 25.12.1

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Free disk
      # ==========================================================

      - name: Free disk space
        run: |

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          df -h


      # ==========================================================
      # 3. Install build dependencies
      # ==========================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xz-utils \
            zstd \
            ccache \
            swig \
            time \
            patch \
            diffutils


      # ==========================================================
      # 4. Clone ImmortalWrt 25.12.1
      # ==========================================================

      - name: Clone ImmortalWrt
        run: |

          git clone \
            --depth=1 \
            --branch="${IMMORTALWRT_VERSION}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo
          echo "=========================================="
          echo "ImmortalWrt version"
          echo "=========================================="

          git describe --tags --always
          git rev-parse HEAD


      # ==========================================================
      # 5. Add third-party package repositories
      # ==========================================================

      - name: Add third party feeds
        run: |

          cd immortalwrt

          mkdir -p package/third-party


          echo
          echo "=========================================="
          echo "Adding sbwml helloworld"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/third-party/helloworld


          echo
          echo "=========================================="
          echo "Adding Lucky"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/third-party/lucky


          echo
          echo "=========================================="
          echo "Adding QuickFile"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/sbwml/luci-app-quickfile.git \
            package/third-party/quickfile


          echo
          echo "=========================================="
          echo "Adding Amlogic package"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/ophub/luci-app-amlogic.git \
            package/third-party/luci-app-amlogic


          echo
          echo "=========================================="
          echo "Adding LinkEase iStore"
          echo "=========================================="

          git clone \
            --depth=1 \
            https://github.com/linkease/istore.git \
            package/third-party/istore


      # ==========================================================
      # 6. Update feeds
      # ==========================================================

      - name: Update feeds
        run: |

          cd immortalwrt

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ==========================================================
      # 7. Inspect requested packages
      # ==========================================================

      - name: Inspect requested packages
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Requested package inspection"
          echo "=========================================="


          for p in \
            daed \
            luci-app-daed \
            luci-app-passwall2 \
            lucky \
            luci-app-lucky \
            luci-app-quickfile \
            luci-app-store \
            luci-app-amlogic \
            tailscale \
            luci-app-tailscale-community \
            minidlna \
            luci-app-minidlna \
            ttyd \
            luci-app-ttyd \
            vlmcsd \
            luci-app-vlmcsd \
            luci-app-upnp
          do

            echo
            echo "----- ${p} -----"

            find package feeds \
              -type f \
              -name Makefile \
              -exec grep -l \
              "PKG_NAME.*${p}\|Package/${p}" \
              {} \; \
              2>/dev/null \
              | head -10 \
              || true

          done


      # ==========================================================
      # 8. Create base OpenWrt configuration
      # ==========================================================

      - name: Create OpenWrt configuration
        run: |

          cd immortalwrt

          cat > .config <<'EOF'

          #
          # Target
          #

          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y


          #
          # Root filesystem
          #

          CONFIG_TARGET_ROOTFS_TARGZ=y


          #
          # LuCI
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          #
          # Firewall
          #

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y


          #
          # DAED
          #

          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_luci-app-daed=y


          #
          # PassWall2
          #

          CONFIG_PACKAGE_luci-app-passwall2=y


          #
          # Lucky
          #

          CONFIG_PACKAGE_lucky=y
          CONFIG_PACKAGE_luci-app-lucky=y


          #
          # QuickFile
          #

          CONFIG_PACKAGE_luci-app-quickfile=y


          #
          # LinkEase / iStore
          #

          CONFIG_PACKAGE_luci-app-store=y


          #
          # Amlogic Treasure Box
          #

          CONFIG_PACKAGE_luci-app-amlogic=y


          #
          # Tailscale
          #

          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y


          #
          # MiniDLNA
          #

          CONFIG_PACKAGE_minidlna=y
          CONFIG_PACKAGE_luci-app-minidlna=y


          #
          # TTYD
          #

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y


          #
          # VLMCSD
          #

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          #
          # UPnP
          #

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y


          #
          # USB
          #

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_usbutils=y


          #
          # Filesystems
          #

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_block-mount=y


          #
          # Utilities
          #

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y

          EOF


      # ==========================================================
      # 9. Run OpenWrt defconfig
      # ==========================================================

      - name: Resolve package dependencies
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Running make defconfig"
          echo "=========================================="

          make defconfig V=s


      # ==========================================================
      # 10. Verify selected packages
      # ==========================================================

      - name: Verify selected packages
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Selected packages"
          echo "=========================================="


          for p in \
            daed \
            luci-app-daed \
            luci-app-passwall2 \
            lucky \
            luci-app-lucky \
            luci-app-quickfile \
            luci-app-store \
            luci-app-amlogic \
            tailscale \
            luci-app-tailscale-community \
            minidlna \
            luci-app-minidlna \
            ttyd \
            luci-app-ttyd \
            vlmcsd \
            luci-app-vlmcsd \
            luci-app-upnp \
            kmod-usb-storage \
            kmod-fs-ext4 \
            kmod-fs-vfat \
            kmod-fs-exfat \
            block-mount \
            usbutils \
            curl \
            wget-ssl \
            htop
          do

            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then

              echo "[ OK ] ${p}"

            else

              echo "[FAIL] ${p}"

            fi

          done


      # ==========================================================
      # 11. Configure LAN IP
      # ==========================================================

      - name: Configure LAN
        run: |

          cd immortalwrt

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-n1-network <<'EOF'
          #!/bin/sh

          uci set network.lan.ipaddr='10.0.0.254'
          uci set network.lan.netmask='255.255.255.0'

          uci commit network

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-n1-network


      # ==========================================================
      # 12. Prepare Linux kernel
      # ==========================================================

      - name: Prepare Linux kernel
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Preparing Linux kernel"
          echo "=========================================="

          make target/linux/prepare V=s

          echo
          echo "Kernel source directories:"

          find build_dir \
            -maxdepth 6 \
            -type d \
            -name 'linux-6.12.*' \
            -print


      # ==========================================================
      # 13. Generate kernel configuration
      #
      # IMPORTANT:
      #
      # Do NOT use:
      #
      # make target/linux/oldconfig
      #
      # This target does not exist.
      # ==========================================================

      - name: Generate kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Generating Linux kernel configuration"
          echo "=========================================="

          make target/linux/config V=s


      # ==========================================================
      # 14. Locate kernel configuration
      # ==========================================================

      - name: Locate kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Locating kernel configuration"
          echo "=========================================="


          KERNEL_CONFIG=$(find build_dir \
            -type f \
            -path '*/linux-6.12.*/.config' \
            | head -1)


          echo
          echo "Kernel config:"
          echo "${KERNEL_CONFIG}"


          if [ -z "${KERNEL_CONFIG}" ]; then

            echo
            echo "ERROR: kernel configuration not found"

            echo
            echo "All .config files:"

            find build_dir \
              -type f \
              -name '.config' \
              -print

            exit 1

          fi


          echo "${KERNEL_CONFIG}" > /tmp/kernel_config_path


      # ==========================================================
      # 15. Configure DAED kernel support
      # ==========================================================

      - name: Configure DAED eBPF and BTF
        run: |

          cd immortalwrt

          KERNEL_CONFIG=$(cat /tmp/kernel_config_path)


          echo
          echo "=========================================="
          echo "Configuring DAED kernel support"
          echo "=========================================="

          echo "Kernel config:"
          echo "${KERNEL_CONFIG}"


          ./scripts/config --file "${KERNEL_CONFIG}" \
            --enable CONFIG_BPF \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_BPF_JIT \
            --enable CONFIG_BPF_EVENTS \
            --enable CONFIG_BPF_STREAM_PARSER \
            --enable CONFIG_CGROUPS \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_NET_INGRESS \
            --enable CONFIG_NET_EGRESS \
            --enable CONFIG_NET_CLS_ACT \
            --module CONFIG_NET_CLS_BPF \
            --module CONFIG_NET_SCH_INGRESS \
            --enable CONFIG_DEBUG_INFO \
            --disable CONFIG_DEBUG_INFO_REDUCED \
            --enable CONFIG_DEBUG_INFO_BTF \
            --enable CONFIG_DEBUG_INFO_BTF_MODULES


          echo
          echo "=========================================="
          echo "DAED kernel configuration"
          echo "=========================================="


          grep -E \
            'CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|BPF_STREAM_PARSER|CGROUPS|KPROBES|KPROBE_EVENTS|NET_INGRESS|NET_EGRESS|NET_CLS_ACT|NET_CLS_BPF|NET_SCH_INGRESS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES)=' \
            "${KERNEL_CONFIG}" \
            || true


      # ==========================================================
      # 16. Re-run kernel config after modification
      # ==========================================================

      - name: Refresh kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Refreshing kernel configuration"
          echo "=========================================="

          make target/linux/refresh V=s


      # ==========================================================
      # 17. Verify DAED kernel support
      # ==========================================================

      - name: Verify DAED kernel support
        run: |

          cd immortalwrt

          KERNEL_CONFIG=$(cat /tmp/kernel_config_path)

          echo
          echo "=========================================="
          echo "Verifying DAED kernel support"
          echo "=========================================="


          FAILED=0


          check_config()
          {
            OPTION="$1"

            if grep -q "^${OPTION}$" "${KERNEL_CONFIG}"; then

              echo "[ OK ] ${OPTION}"

            else

              echo "[FAIL] ${OPTION}"

              FAILED=1

            fi
          }


          check_config "CONFIG_BPF=y"
          check_config "CONFIG_BPF_SYSCALL=y"
          check_config "CONFIG_BPF_JIT=y"
          check_config "CONFIG_BPF_EVENTS=y"
          check_config "CONFIG_BPF_STREAM_PARSER=y"
          check_config "CONFIG_CGROUPS=y"
          check_config "CONFIG_KPROBES=y"
          check_config "CONFIG_KPROBE_EVENTS=y"
          check_config "CONFIG_NET_INGRESS=y"
          check_config "CONFIG_NET_EGRESS=y"
          check_config "CONFIG_NET_CLS_ACT=y"


          if grep -q "^CONFIG_DEBUG_INFO_REDUCED=y" "${KERNEL_CONFIG}"; then

            echo "[FAIL] CONFIG_DEBUG_INFO_REDUCED=y"

            FAILED=1

          else

            echo "[ OK ] CONFIG_DEBUG_INFO_REDUCED disabled"

          fi


          check_config "CONFIG_DEBUG_INFO=y"
          check_config "CONFIG_DEBUG_INFO_BTF=y"


          if [ "${FAILED}" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "DAED kernel verification FAILED"
            echo "=========================================="

            exit 1

          fi


          echo
          echo "=========================================="
          echo "DAED kernel verification PASSED"
          echo "=========================================="


      # ==========================================================
      # 18. Build ImmortalWrt
      # ==========================================================

      - name: Build ImmortalWrt
        run: |

          cd immortalwrt

          echo
          echo "=========================================="
          echo "Building ImmortalWrt"
          echo "=========================================="

          make -j2 V=s


      # ==========================================================
      # 19. Show firmware
      # ==========================================================

      - name: Show firmware
        run: |

          echo
          echo "=========================================="
          echo "Firmware output"
          echo "=========================================="

          find immortalwrt/bin/targets \
            -type f \
            -print \
            2>/dev/null \
            | sort


      # ==========================================================
      # 20. Upload ImmortalWrt firmware
      # ==========================================================

      - name: Upload ImmortalWrt firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.1-N1-10.0.0.254

          path: |

            immortalwrt/bin/targets/**

          if-no-files-found: error

          retention-days: 30
