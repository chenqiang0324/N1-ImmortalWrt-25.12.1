name: Build N1 ImmortalWrt 25.12.1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_VERSION: "v25.12.1"

  # ==================================================
  # N1 network
  # ==================================================
  LAN_IP: "10.0.0.254"
  LAN_NETMASK: "255.255.255.0"

  # ==================================================
  # N1 / Phicomm N1
  # ==================================================
  N1_BOARD: "s905d"

  # ==================================================
  # Kernel
  #
  # ImmortalWrt 25.12.1 build kernel:
  # 6.12.x
  #
  # Final N1 kernel:
  # stable 6.12.y
  # ==================================================
  N1_KERNEL: "6.12.y"


jobs:

  build:

    name: N1 / S905D / ImmortalWrt 25.12.1

    runs-on: ubuntu-24.04

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. Free disk
      # ==================================================

      - name: Free disk space
        run: |

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          df -h


      # ==================================================
      # 3. Build dependencies
      # ==================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xz-utils \
            zstd \
            ccache \
            swig \
            time \
            patch \
            diffutils


      # ==================================================
      # 4. Clone ImmortalWrt
      # ==================================================

      - name: Clone ImmortalWrt
        run: |

          git clone \
            --depth=1 \
            --branch="${IMMORTALWRT_VERSION}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo
          echo "======================================"
          echo "ImmortalWrt"
          echo "======================================"

          git describe --tags --always

          echo
          echo "Commit:"
          git rev-parse HEAD


      # ==================================================
      # 5. Add third-party feeds
      # ==================================================

      - name: Add third party feeds
        run: |

          cd immortalwrt

          mkdir -p package/third-party


          # ==================================================
          # sbwml extra packages
          #
          # Contains:
          #   DAED
          #   luci-app-daed
          #   PassWall
          #   PassWall2
          # ==================================================

          echo "======================================"
          echo "Adding sbwml/openwrt_helloworld"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/third-party/helloworld


      # ==================================================
      # 6. Add Lucky
      # ==================================================

      - name: Add Lucky
        run: |

          cd immortalwrt

          echo "======================================"
          echo "Adding Lucky"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/third-party/lucky


      # ==================================================
      # 7. Add QuickFile
      # ==================================================

      - name: Add QuickFile
        run: |

          cd immortalwrt

          echo "======================================"
          echo "Adding QuickFile"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/sbwml/luci-app-quickfile.git \
            package/third-party/quickfile


      # ==================================================
      # 8. Add Amlogic Treasure Box
      # ==================================================

      - name: Add Amlogic Treasure Box
        run: |

          cd immortalwrt

          echo "======================================"
          echo "Adding Amlogic Treasure Box"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/ophub/luci-app-amlogic.git \
            package/third-party/luci-app-amlogic


      # ==================================================
      # 9. Add LinkEase / iStore
      #
      # IMPORTANT:
      #
      # Do NOT copy only luci-app-linkease.
      #
      # The official LinkEase iStore repository is used
      # instead of the old incomplete small-package copy.
      # ==================================================

      - name: Add LinkEase iStore
        run: |

          cd immortalwrt

          echo "======================================"
          echo "Adding LinkEase iStore"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/linkease/istore.git \
            package/third-party/istore


      # ==================================================
      # 10. Update feeds
      # ==================================================

      - name: Update feeds
        run: |

          cd immortalwrt

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ==================================================
      # 11. Package discovery
      # ==================================================

      - name: Inspect packages
        run: |

          cd immortalwrt

          echo
          echo "======================================"
          echo "Searching requested packages"
          echo "======================================"


          find package feeds \
            -type f \
            -name Makefile \
            -print \
            2>/dev/null \
            | grep -E \
              '(daed|passwall2|lucky|quickfile|amlogic|istore|tailscale|ttyd|minidlna|vlmcsd|upnp)' \
            | head -200 \
            || true


      # ==================================================
      # 12. Create OpenWrt configuration
      # ==================================================

      - name: Create OpenWrt configuration
        run: |

          cd immortalwrt

          cat > .config <<'EOF'

          # ==================================================
          # Target
          # ==================================================

          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_TARGZ=y


          # ==================================================
          # LuCI
          # ==================================================

          CONFIG_PACKAGE_luci=y

          CONFIG_PACKAGE_luci-base=y

          CONFIG_PACKAGE_luci-mod-admin-full=y

          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # ==================================================
          # Firewall / nftables
          # ==================================================

          CONFIG_PACKAGE_firewall4=y

          CONFIG_PACKAGE_nftables=y

          CONFIG_PACKAGE_ip-full=y


          # ==================================================
          # DAED
          # ==================================================

          CONFIG_PACKAGE_daed=y

          CONFIG_PACKAGE_luci-app-daed=y


          # ==================================================
          # PassWall2
          # ==================================================

          CONFIG_PACKAGE_luci-app-passwall2=y


          # ==================================================
          # Lucky
          # ==================================================

          CONFIG_PACKAGE_lucky=y

          CONFIG_PACKAGE_luci-app-lucky=y


          # ==================================================
          # QuickFile
          # ==================================================

          CONFIG_PACKAGE_luci-app-quickfile=y


          # ==================================================
          # LinkEase / iStore
          # ==================================================

          CONFIG_PACKAGE_luci-app-store=y


          # ==================================================
          # Amlogic Treasure Box
          # ==================================================

          CONFIG_PACKAGE_luci-app-amlogic=y


          # ==================================================
          # Tailscale
          # ==================================================

          CONFIG_PACKAGE_tailscale=y

          CONFIG_PACKAGE_luci-app-tailscale-community=y


          # ==================================================
          # MiniDLNA
          # ==================================================

          CONFIG_PACKAGE_minidlna=y

          CONFIG_PACKAGE_luci-app-minidlna=y


          # ==================================================
          # TTYD
          # ==================================================

          CONFIG_PACKAGE_ttyd=y

          CONFIG_PACKAGE_luci-app-ttyd=y


          # ==================================================
          # VLMCSD
          # ==================================================

          CONFIG_PACKAGE_vlmcsd=y

          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ==================================================
          # UPnP
          # ==================================================

          CONFIG_PACKAGE_miniupnpd-nftables=y

          CONFIG_PACKAGE_luci-app-upnp=y


          # ==================================================
          # USB
          # ==================================================

          CONFIG_PACKAGE_kmod-usb-storage=y

          CONFIG_PACKAGE_usbutils=y


          # ==================================================
          # Filesystems
          # ==================================================

          CONFIG_PACKAGE_kmod-fs-ext4=y

          CONFIG_PACKAGE_kmod-fs-vfat=y

          CONFIG_PACKAGE_kmod-fs-exfat=y

          CONFIG_PACKAGE_block-mount=y


          # ==================================================
          # Tools
          # ==================================================

          CONFIG_PACKAGE_curl=y

          CONFIG_PACKAGE_wget-ssl=y

          CONFIG_PACKAGE_htop=y

          EOF


      # ==================================================
      # 13. Resolve dependencies
      # ==================================================

      - name: Resolve package dependencies
        run: |

          cd immortalwrt

          echo
          echo "======================================"
          echo "Running make defconfig"
          echo "======================================"

          make defconfig V=s


      # ==================================================
      # 14. Verify requested packages
      # ==================================================

      - name: Verify package selection
        run: |

          cd immortalwrt

          echo
          echo "======================================"
          echo "Final package selection"
          echo "======================================"

          grep -E \
            '^CONFIG_PACKAGE_' \
            .config \
            | grep -E \
              '(daed|luci-app-daed|passwall2|lucky|quickfile|luci-app-store|amlogic|tailscale|ttyd|minidlna|vlmcsd|upnp|usb-storage|fs-ext4|fs-vfat|fs-exfat|block-mount|usbutils|curl|wget-ssl|htop)' \
            | sort \
            || true


      # ==================================================
      # 15. Configure LAN
      # ==================================================

      - name: Configure LAN IP
        run: |

          cd immortalwrt

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-n1-network <<'EOF'
          #!/bin/sh

          uci set network.lan.ipaddr='10.0.0.254'
          uci set network.lan.netmask='255.255.255.0'

          uci commit network

          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-n1-network


      # ==================================================
      # 16. Prepare Linux kernel
      # ==================================================

      - name: Prepare Linux kernel
        run: |

          cd immortalwrt

          echo
          echo "======================================"
          echo "Preparing Linux kernel"
          echo "======================================"

          make target/linux/prepare V=s


          echo
          echo "Kernel directories:"

          find build_dir \
            -maxdepth 6 \
            -type d \
            -name 'linux-6.12.*' \
            -print


      # ==================================================
      # 17. Generate kernel configuration
      #
      # IMPORTANT:
      #
      # There is NO:
      #
      # make target/linux/oldconfig
      #
      # because that target does not exist.
      #
      # defconfig already generated above.
      # ==================================================

      - name: Locate kernel configuration
        run: |

          cd immortalwrt

          echo
          echo "======================================"
          echo "Locating kernel configuration"
          echo "======================================"

          KERNEL_CONFIG=$(find build_dir \
            -type f \
            -path '*/linux-6.12.*/.config' \
            | head -1)


          echo "Kernel config:"
          echo "${KERNEL_CONFIG}"


          if [ -z "${KERNEL_CONFIG}" ]; then

            echo
            echo "ERROR: kernel configuration not found"

            echo
            echo "Available kernel directories:"

            find build_dir \
              -type d \
              -name 'linux-*' \
              -print

            exit 1

          fi


          echo "${KERNEL_CONFIG}" > /tmp/kernel_config_path


      # ==================================================
      # 18. Configure DAED kernel support
      # ==================================================

      - name: Configure DAED eBPF and BTF
        run: |

          cd immortalwrt

          KERNEL_CONFIG=$(cat /tmp/kernel_config_path)


          echo
          echo "======================================"
          echo "DAED kernel configuration"
          echo "======================================"

          echo "Using:"
          echo "${KERNEL_CONFIG}"


          ./scripts/config --file "${KERNEL_CONFIG}" \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT \
            --enable BPF_EVENTS \
            --enable BPF_STREAM_PARSER \
            --enable CGROUPS \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable NET_INGRESS \
            --enable NET_EGRESS \
            --enable NET_CLS_ACT \
            --module NET_CLS_BPF \
            --module NET_SCH_INGRESS \
            --enable DEBUG_INFO \
            --disable DEBUG_INFO_REDUCED \
            --enable DEBUG_INFO_BTF \
            --enable DEBUG_INFO_BTF_MODULES


          echo
          echo "======================================"
          echo "DAED kernel configuration result"
          echo "======================================"

          grep -E \
            'CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|BPF_STREAM_PARSER|CGROUPS|KPROBES|KPROBE_EVENTS|NET_INGRESS|NET_EGRESS|NET_CLS_ACT|NET_CLS_BPF|NET_SCH_INGRESS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES)=' \
            "${KERNEL_CONFIG}" \
            || true


      # ==================================================
      # 19. Verify DAED kernel support
      # ==================================================

      - name: Verify DAED kernel support
        run: |

          cd immortalwrt

          KERNEL_CONFIG=$(cat /tmp/kernel_config_path)

          FAILED=0


          check_config()
          {
            OPTION="$1"

            if grep -q "^${OPTION}$" "${KERNEL_CONFIG}"; then

              echo "[ OK ] ${OPTION}"

            else

              echo "[FAIL] ${OPTION}"

              FAILED=1

            fi
          }


          echo
          echo "======================================"
          echo "Checking DAED eBPF / BTF"
          echo "======================================"


          check_config "CONFIG_BPF=y"

          check_config "CONFIG_BPF_SYSCALL=y"

          check_config "CONFIG_BPF_JIT=y"

          check_config "CONFIG_BPF_EVENTS=y"

          check_config "CONFIG_BPF_STREAM_PARSER=y"

          check_config "CONFIG_CGROUPS=y"

          check_config "CONFIG_KPROBES=y"

          check_config "CONFIG_KPROBE_EVENTS=y"

          check_config "CONFIG_NET_INGRESS=y"

          check_config "CONFIG_NET_EGRESS=y"

          check_config "CONFIG_NET_CLS_ACT=y"

          check_config "CONFIG_NET_CLS_BPF=m"

          check_config "CONFIG_NET_SCH_INGRESS=m"

          check_config "CONFIG_DEBUG_INFO=y"

          check_config "CONFIG_DEBUG_INFO_BTF=y"


          if grep -q '^CONFIG_DEBUG_INFO_REDUCED=y' "${KERNEL_CONFIG}"; then

            echo "[FAIL] CONFIG_DEBUG_INFO_REDUCED=y"

            FAILED=1

          else

            echo "[ OK ] CONFIG_DEBUG_INFO_REDUCED disabled"

          fi


          if [ "${FAILED}" -ne 0 ]; then

            echo
            echo "======================================"
            echo "DAED kernel verification FAILED"
            echo "======================================"

            exit 1

          fi


          echo
          echo "======================================"
          echo "DAED kernel verification PASSED"
          echo "======================================"


      # ==================================================
      # 20. Build ImmortalWrt
      # ==================================================

      - name: Build ImmortalWrt
        run: |

          cd immortalwrt

          echo
          echo "======================================"
          echo "Building ImmortalWrt"
          echo "======================================"

          make -j2 V=s


      # ==================================================
      # 21. Find rootfs
      # ==================================================

      - name: Find rootfs
        run: |

          cd immortalwrt

          echo
          echo "======================================"
          echo "Searching rootfs"
          echo "======================================"

          find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            -print


      # ==================================================
      # 22. Prepare rootfs
      # ==================================================

      - name: Prepare N1 rootfs
        run: |

          mkdir -p rootfs


          ROOTFS=$(find immortalwrt/bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -1)


          if [ -z "${ROOTFS}" ]; then

            echo "ERROR: rootfs.tar.gz not found"

            exit 1

          fi


          echo
          echo "Using rootfs:"
          echo "${ROOTFS}"


          cp "${ROOTFS}" \
            rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz


          ls -lh rootfs/


      # ==================================================
      # 23. Package N1 / S905D
      #
      # Final kernel:
      # stable 6.12.y
      # ==================================================

      - name: Package Phicomm N1
        uses: ophub/amlogic-s9xxx-openwrt@main

        with:

          openwrt_path: rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz

          openwrt_board: s905d

          kernel_repo: ophub/kernel

          kernel_usage: stable

          openwrt_kernel: 6.12.y

          auto_kernel: true

          openwrt_ip: 10.0.0.254

          openwrt_size: 512/2048

          builder_name: ImmortalWrt-25.12.1-N1


      # ==================================================
      # 24. Show output
      # ==================================================

      - name: Show firmware
        run: |

          echo
          echo "======================================"
          echo "N1 FIRMWARE OUTPUT"
          echo "======================================"

          find out \
            -maxdepth 3 \
            -type f \
            -print \
            2>/dev/null \
            || true


      # ==================================================
      # 25. Upload artifact
      # ==================================================

      - name: Upload N1 firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.1-N1-10.0.0.254

          path: |

            out/**

            rootfs/**

          if-no-files-found: error

          retention-days: 30
