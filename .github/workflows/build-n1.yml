name: Build N1 ImmortalWrt 25.12.1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMMORTALWRT_VERSION: "v25.12.1"
  LAN_IP: "192.168.1.1"

jobs:
  build:
    name: Build N1 / S905D
    runs-on: ubuntu-24.04

    steps:

      # ==================================================
      # 1. 获取你的 GitHub 工程
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # 2. 清理 GitHub Actions 空间
      # ==================================================
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          df -h

      # ==================================================
      # 3. 安装编译工具
      # ==================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xz-utils \
            zstd \
            ccache \
            swig \
            time

      # ==================================================
      # 4. 下载 ImmortalWrt 25.12.1
      # ==================================================
      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth=1 \
            --branch="${IMMORTALWRT_VERSION}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "ImmortalWrt commit:"
          git rev-parse HEAD

      # ==================================================
      # 5. 加入第三方软件包
      # ==================================================
      - name: Add third party feeds
        run: |
          cd immortalwrt

          mkdir -p package/third-party

          echo "Adding DAED / PassWall2..."

          git clone \
            --depth=1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/third-party/helloworld

          echo "Adding Lucky..."

          git clone \
            --depth=1 \
            https://github.com/sirpdboy/luci-app-lucky.git \
            package/third-party/lucky

          echo "Adding QuickFile..."

          git clone \
            --depth=1 \
            https://github.com/sbwml/luci-app-quickfile.git \
            package/third-party/quickfile

          echo "Adding Amlogic Treasure Box..."

          git clone \
            --depth=1 \
            https://github.com/ophub/luci-app-amlogic.git \
            package/third-party/luci-app-amlogic

          echo "Adding LinkEase..."

          git clone \
            --depth=1 \
            https://github.com/kenzok8/small-package.git \
            package/third-party/small-package

      # ==================================================
      # 6. 更新 OpenWrt feeds
      # ==================================================
      - name: Update feeds
        run: |
          cd immortalwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==================================================
      # 7. 显示实际找到的插件
      # ==================================================
      - name: Check packages
        run: |
          cd immortalwrt

          echo "======================================"
          echo "Checking requested packages"
          echo "======================================"

          for pkg in \
            luci-app-daed \
            luci-app-passwall2 \
            luci-app-lucky \
            luci-app-quickfile \
            luci-app-amlogic \
            luci-app-linkease
          do
            echo
            echo "========== ${pkg} =========="

            grep -R \
              "define Package/${pkg}" \
              package feeds \
              2>/dev/null \
              | head -10 || true
          done

      # ==================================================
      # 8. 创建基础配置
      # ==================================================
      - name: Create configuration
        run: |
          cd immortalwrt

          cat > .config <<'EOF'

          # ==================================================
          # Target
          # ==================================================

          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y

          CONFIG_TARGET_ROOTFS_TARGZ=y


          # ==================================================
          # LuCI
          # ==================================================

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y


          # ==================================================
          # Firewall / Network
          # ==================================================

          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_ip-full=y


          # ==================================================
          # DAED
          # ==================================================

          CONFIG_PACKAGE_luci-app-daed=y
          CONFIG_PACKAGE_daed=y

          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-inet-diag=y


          # ==================================================
          # PassWall2
          # ==================================================

          CONFIG_PACKAGE_luci-app-passwall2=y

          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_hysteria=y

          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y

          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_coreutils-nohup=y


          # ==================================================
          # Lucky
          # ==================================================

          CONFIG_PACKAGE_luci-app-lucky=y
          CONFIG_PACKAGE_lucky=y


          # ==================================================
          # QuickFile
          # ==================================================

          CONFIG_PACKAGE_luci-app-quickfile=y
          CONFIG_PACKAGE_quickfile=y


          # ==================================================
          # LinkEase
          # ==================================================

          CONFIG_PACKAGE_luci-app-linkease=y


          # ==================================================
          # Amlogic Treasure Box
          # ==================================================

          CONFIG_PACKAGE_luci-app-amlogic=y


          # ==================================================
          # Tailscale
          # ==================================================

          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y


          # ==================================================
          # MiniDLNA
          # ==================================================

          CONFIG_PACKAGE_minidlna=y
          CONFIG_PACKAGE_luci-app-minidlna=y


          # ==================================================
          # TTYD
          # ==================================================

          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y


          # ==================================================
          # VLMCSD
          # ==================================================

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y


          # ==================================================
          # UPnP
          # ==================================================

          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y


          # ==================================================
          # USB
          # ==================================================

          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_usbutils=y


          # ==================================================
          # Filesystem
          # ==================================================

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y

          CONFIG_PACKAGE_block-mount=y


          # ==================================================
          # Disk tools
          # ==================================================

          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_lsblk=y


          # ==================================================
          # Tools
          # ==================================================

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y

          EOF

      # ==================================================
      # 9. 让 OpenWrt 自动解决依赖
      # ==================================================
      - name: Resolve dependencies
        run: |
          cd immortalwrt

          make defconfig

      # ==================================================
      # 10. 显示最终配置
      # ==================================================
      - name: Show final configuration
        run: |
          cd immortalwrt

          echo "======================================"
          echo "TARGET"
          echo "======================================"

          grep '^CONFIG_TARGET_' .config || true

          echo
          echo "======================================"
          echo "REQUESTED PACKAGES"
          echo "======================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-|luci-i18n-|daed|lucky|quickfile|tailscale|xray-core|sing-box|hysteria|kmod-nft|kmod-usb|kmod-fs-|block-mount|usbutils|curl|wget-ssl|htop)' \
            .config \
            | sort || true

      # ==================================================
      # 11. 准备 Linux 内核
      # ==================================================
      - name: Prepare Linux kernel
        run: |
          cd immortalwrt

          make target/linux/prepare V=s

      # ==================================================
      # 12. 配置 DAED 所需的 eBPF/BTF
      # ==================================================
      - name: Configure DAED kernel support
        run: |
          cd immortalwrt

          KERNEL_CONFIG=$(find build_dir \
            -type f \
            -path '*/linux-*/.config' \
            | head -1)

          if [ -z "$KERNEL_CONFIG" ]; then
            echo "ERROR: kernel configuration not found"
            exit 1
          fi

          echo "Using kernel config:"
          echo "$KERNEL_CONFIG"

          ./scripts/config --file "$KERNEL_CONFIG" \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT \
            --enable BPF_EVENTS \
            --enable BPF_STREAM_PARSER \
            --enable CGROUPS \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --enable NET_INGRESS \
            --enable NET_EGRESS \
            --enable NET_CLS_ACT \
            --module NET_CLS_BPF \
            --module NET_SCH_INGRESS \
            --enable DEBUG_INFO \
            --disable DEBUG_INFO_REDUCED \
            --enable DEBUG_INFO_BTF \
            --enable DEBUG_INFO_BTF_MODULES

          echo
          echo "======================================"
          echo "DAED KERNEL CONFIG"
          echo "======================================"

          grep -E \
            'CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|BPF_STREAM_PARSER|CGROUPS|KPROBES|KPROBE_EVENTS|NET_INGRESS|NET_EGRESS|NET_CLS_ACT|NET_CLS_BPF|NET_SCH_INGRESS|DEBUG_INFO_BTF)=' \
            "$KERNEL_CONFIG" \
            || true

      # ==================================================
      # 13. 编译
      # ==================================================
      - name: Build ImmortalWrt
        run: |
          cd immortalwrt

          make -j2 V=s

      # ==================================================
      # 14. 查找 rootfs
      # ==================================================
      - name: Find rootfs
        run: |
          cd immortalwrt

          find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            -print

      # ==================================================
      # 15. 准备 N1 打包
      # ==================================================
      - name: Prepare rootfs
        run: |
          mkdir -p rootfs

          ROOTFS=$(find immortalwrt/bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -1)

          if [ -z "$ROOTFS" ]; then
            echo "ERROR: rootfs not found"
            exit 1
          fi

          cp "$ROOTFS" \
            rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz

          ls -lh rootfs/

      # ==================================================
      # 16. 使用 ophub 打包 N1
      # ==================================================
      - name: Package Phicomm N1
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: rootfs/openwrt-armsr-armv8-generic-rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ophub/kernel
          kernel_usage: stable
          openwrt_kernel: 6.12.y
          auto_kernel: true
          openwrt_ip: 192.168.1.1
          openwrt_size: 512/2048
          builder_name: ImmortalWrt-25.12.1-N1

      # ==================================================
      # 17. 显示最终固件
      # ==================================================
      - name: Show firmware
        run: |
          echo "======================================"
          echo "FINAL FIRMWARE"
          echo "======================================"

          find out \
            -type f \
            -maxdepth 2 \
            -print \
            2>/dev/null || true

      # ==================================================
      # 18. 上传 Artifact
      # ==================================================
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.1-N1
          path: |
            out/**
            rootfs/**
          if-no-files-found: error
          retention-days: 30
